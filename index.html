<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সহজ আয়-ব্যয় হিসাব</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-area { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Print Button -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900"><i class="fa-solid fa-wallet text-sky-600 mr-2"></i>দৈনন্দিন আয়-ব্যয় হিসাব</h1>
                <p class="text-xs text-slate-500 mt-0.5">খুব সহজে আপনার হিসাব লিখে রাখুন এবং প্রিন্ট করুন</p>
            </div>
            <button onclick="window.print()" class="no-print w-full sm:w-auto px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs shadow transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-print"></i>
                <span>রিপোর্ট প্রিন্ট করুন</span>
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-emerald-600 uppercase">মোট আয়</span>
                <h3 class="text-xl font-bold text-slate-900 mt-1" id="total-income">৳ ০.০০</h3>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-rose-600 uppercase">মোট ব্যয়</span>
                <h3 class="text-xl font-bold text-slate-900 mt-1" id="total-expense">৳ ০.০০</h3>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-sky-600 uppercase">অবশিষ্ট জের (ব্যালেন্স)</span>
                <h3 class="text-xl font-bold text-slate-900 mt-1" id="net-balance">৳ ০.০০</h3>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="no-print bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="text-sm font-bold text-slate-900 mb-3"><i class="fa-solid fa-plus-circle text-sky-600 mr-1.5"></i>নতুন হিসাব যোগ করুন</h2>
            
            <form onsubmit="addTransaction(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">ধরন</label>
                    <select id="trans-type" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium">
                        <option value="income">আয় (Income)</option>
                        <option value="expense">ব্যয় (Expense)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">তারিখ</label>
                    <input type="date" id="trans-date" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">খাত বা বিবরণ</label>
                    <input type="text" id="trans-category" required placeholder="যেমন: বাজার, বেতন" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">টাকা (৳)</label>
                    <input type="number" step="0.01" min="0.01" id="trans-amount" required placeholder="৫০০" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium">
                </div>

                <div class="flex items-end">
                    <button type="submit" class="w-full py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs shadow transition">
                        যুক্ত করুন
                    </button>
                </div>
            </form>
        </div>

        <!-- Transactions List Table -->
        <div class="print-area bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-900"><i class="fa-solid fa-list text-sky-600 mr-1.5"></i>সকল লেনদেনের বিবরণী</h2>
                <button onclick="clearAllData()" class="no-print text-[11px] text-rose-600 hover:underline">সব ডাটা মুছুন</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 uppercase font-semibold">
                            <th class="py-2.5 px-3">তারিখ</th>
                            <th class="py-2.5 px-3">ধরন</th>
                            <th class="py-2.5 px-3">খাত</th>
                            <th class="py-2.5 px-3 text-right">পরিমাণ (৳)</th>
                            <th class="no-print py-2.5 px-3 text-center">মুছুন</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-tbody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('trans-date').value = new Date().toISOString().split('T')[0];

        let transactions = JSON.parse(localStorage.getItem('simple_transactions')) || [];

        function renderApp() {
            const tbody = document.getElementById('transaction-tbody');
            tbody.innerHTML = '';

            let totalIncome = 0;
            let totalExpense = 0;

            if (transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">কোনো হিসাব যোগ করা হয়নি</td></tr>`;
            } else {
                transactions.forEach((t, index) => {
                    if (t.type === 'income') totalIncome += t.amount;
                    else totalExpense += t.amount;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50";
                    tr.innerHTML = `
                        <td class="py-2.5 px-3 text-slate-600">${t.date}</td>
                        <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${t.type === 'income' ? 'আয়' : 'ব্যয়'}</span></td>
                        <td class="py-2.5 px-3 font-semibold">${t.category}</td>
                        <td class="py-2.5 px-3 text-right font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">${t.type === 'income' ? '+' : '-'} ৳ ${t.amount.toFixed(2)}</td>
                        <td class="no-print py-2.5 px-3 text-center">
                            <button onclick="deleteItem(${index})" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('total-income').innerText = '৳ ' + totalIncome.toFixed(2);
            document.getElementById('total-expense').innerText = '৳ ' + totalExpense.toFixed(2);
            document.getElementById('net-balance').innerText = '৳ ' + (totalIncome - totalExpense).toFixed(2);
        }

        function addTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('trans-type').value;
            const date = document.getElementById('trans-date').value;
            const category = document.getElementById('trans-category').value.trim();
            const amount = parseFloat(document.getElementById('trans-amount').value);

            transactions.unshift({ type, date, category, amount });
            localStorage.setItem('simple_transactions', JSON.stringify(transactions));

            document.getElementById('trans-category').value = '';
            document.getElementById('trans-amount').value = '';
            renderApp();
        }

        function deleteItem(index) {
            transactions.splice(index, 1);
            localStorage.setItem('simple_transactions', JSON.stringify(transactions));
            renderApp();
        }

        function clearAllData() {
            if (confirm('সব ডাটা মুছে ফেলতে চান?')) {
                transactions = [];
                localStorage.removeItem('simple_transactions');
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>
