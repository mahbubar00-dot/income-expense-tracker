<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রতিদিনের আয়-ব্যয় হিসাব | Daily Income & Expense Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Hind Siliguri"', '"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDd0POoFX067ZihlROIlNnSxExJdZj2bzI",
            authDomain: "income-expense-tracker-bab65.firebaseapp.com",
            databaseURL: "https://income-expense-tracker-bab65-default-rtdb.firebaseio.com",
            projectId: "income-expense-tracker-bab65",
            storageBucket: "income-expense-tracker-bab65.firebasestorage.app",
            messagingSenderId: "179518479679",
            appId: "1:179518479679:web:845e07cab7ac0b6682078a",
            measurementId: "G-BR16PC5YW2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbOnValue = onValue;
    </script>

    <style>
        body { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col antialiased">

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Toolbar -->
    <div id="auth-toolbar" class="fixed top-4 right-4 z-50 flex items-center space-x-2">
        <button onclick="toggleTheme()" class="w-8 h-8 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-200 flex items-center justify-center shadow-sm">
            <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
            <i class="fa-solid fa-moon inline dark:hidden text-slate-600"></i>
        </button>
    </div>

    <!-- Auth Container -->
    <div id="auth-container" class="flex-grow flex items-center justify-center p-4 my-auto">
        <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-sky-100 dark:bg-sky-900/50 text-sky-600 dark:text-sky-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-white">আয়-ব্যয় ট্র্যাকার</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">সহজ ও নিরাপদ উপায়ে দৈনন্দিন হিসাব রাখুন</p>
            </div>

            <div class="flex bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-slate-800 text-sky-600 dark:text-sky-400 shadow-sm">লগইন</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 dark:text-slate-400">সাইন আপ</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">মোবাইল নাম্বার বা ইমেইল</label>
                    <input type="text" id="login-identifier" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-sm" placeholder="01700000000 বা name@mail.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="login-password" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl shadow">
                    প্রবেশ করুন <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="form-signup" onsubmit="handleSignup(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">আপনার নাম</label>
                    <input type="text" id="signup-name" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-sm" placeholder="আপনার নাম">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">মোবাইল নাম্বার বা ইমেইল</label>
                    <input type="text" id="signup-identifier" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-sm" placeholder="01700000000 বা name@mail.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="signup-password" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-sm" placeholder="কমপক্ষে ৪ অঙ্কের পাসওয়ার্ড">
                </div>
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow">
                    অ্যাকাউন্ট তৈরি করুন <i class="fa-solid fa-user-plus ml-1"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="hidden flex-grow flex flex-col">
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 shadow-sm">
            <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img id="nav-user-avatar" src="https://placehold.co/100x100/0284c7/ffffff?text=U" class="w-9 h-9 rounded-full object-cover border">
                    <div>
                        <span class="font-bold text-sm block text-slate-800 dark:text-white" id="user-display-name">ব্যবহারকারী</span>
                    </div>
                </div>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> লগআউট
                </button>
            </div>
        </header>

        <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
            <section id="section-dashboard" class="space-y-6">
                <!-- Summary Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm">
                        <p class="text-xs font-bold text-emerald-600 uppercase">মোট আয়</p>
                        <h3 class="text-2xl font-bold mt-1" id="dash-total-income">৳ ০.০০</h3>
                    </div>
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm">
                        <p class="text-xs font-bold text-rose-600 uppercase">মোট ব্যয়</p>
                        <h3 class="text-2xl font-bold mt-1" id="dash-total-expense">৳ ০.০০</h3>
                    </div>
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm">
                        <p class="text-xs font-bold text-sky-600 uppercase">অবশিষ্ট জের (ব্যালেন্স)</p>
                        <h3 class="text-2xl font-bold mt-1" id="dash-net-balance">৳ ০.০০</h3>
                    </div>
                </div>

                <!-- Input Form & Table -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm lg:col-span-1">
                        <h2 class="text-base font-bold mb-4">নতুন হিসাব যোগ করুন</h2>
                        <form onsubmit="handleAddTransaction(event)" class="space-y-3.5">
                            <div>
                                <label class="block text-xs font-bold mb-1">লেনদেনের ধরন</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button type="button" id="type-income-btn" onclick="setTransactionType('income')" class="py-2 text-xs font-bold rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-700">আয়</button>
                                    <button type="button" id="type-expense-btn" onclick="setTransactionType('expense')" class="py-2 text-xs font-bold rounded-lg border border-slate-200 text-slate-500">ব্যয়</button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold mb-1">তারিখ</label>
                                <input type="date" id="trans-date" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-lg text-xs">
                            </div>
                            <div>
                                <label class="block text-xs font-bold mb-1">খাত</label>
                                <input type="text" id="trans-category" required placeholder="যেমন: বেতন, বাজার" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-lg text-xs">
                            </div>
                            <div>
                                <label class="block text-xs font-bold mb-1">টাকার পরিমাণ (৳)</label>
                                <input type="number" step="0.01" min="0.01" id="trans-amount" required placeholder="৫০০" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-lg text-xs">
                            </div>
                            <div>
                                <label class="block text-xs font-bold mb-1">নোট / বিবরণ (ঐচ্ছিক)</label>
                                <input type="text" id="trans-note" placeholder="নোট" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-lg text-xs">
                            </div>
                            <button type="submit" class="w-full py-2.5 bg-sky-600 text-white font-semibold rounded-lg text-xs">হিসাব যুক্ত করুন</button>
                        </form>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm lg:col-span-2">
                        <h2 class="text-base font-bold mb-4">সাম্প্রতিক লেনদেনসমূহ (সর্বশেষ আগে)</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="border-b text-slate-500 font-semibold">
                                        <th class="py-2 px-2">তারিখ</th>
                                        <th class="py-2 px-2">খাত</th>
                                        <th class="py-2 px-2">নোট</th>
                                        <th class="py-2 px-2 text-right">পরিমাণ</th>
                                        <th class="py-2 px-2 text-center">মুছুন</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-transactions-tbody" class="divide-y"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        let currentUser = null;
        let currentType = 'income';

        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-2.5 rounded-xl text-xs font-bold text-white shadow-lg ${isError ? 'bg-rose-600' : 'bg-emerald-600'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function cleanKey(str) {
            return str.trim().toLowerCase().replace(/[^a-zA-Z0-9]/g, "_");
        }

        window.onload = function() {
            document.getElementById('trans-date').value = new Date().toISOString().split('T')[0];
            const savedUserKey = localStorage.getItem('expense_user_key');
            if (savedUserKey) {
                attachLiveUserListener(savedUserKey);
            }
        };

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-signup').classList.add('hidden');
            } else {
                document.getElementById('form-signup').classList.remove('hidden');
                document.getElementById('form-login').classList.add('hidden');
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const rawIdentifier = document.getElementById('signup-identifier').value.trim();
            const key = cleanKey(rawIdentifier);
            const password = document.getElementById('signup-password').value;

            try {
                const snap = await window.dbGet(window.dbRef(window.db, 'users/' + key));
                if (snap.exists()) {
                    showToast('এই নম্বর/ইমেইল দিয়ে অ্যাকাউন্ট তৈরি আছে!', true);
                    return;
                }

                const newUser = { name, rawIdentifier, key, password, transactions: [] };
                await window.dbSet(window.dbRef(window.db, 'users/' + key), newUser);
                localStorage.setItem('expense_user_key', key);
                attachLiveUserListener(key);
                showToast('অ্যাকাউন্ট তৈরি সফল হয়েছে!');
            } catch(err) {
                showToast('ত্রুটি ঘটেছে!', true);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('login-identifier').value.trim();
            const key = cleanKey(inputVal);
            const password = document.getElementById('login-password').value;

            try {
                const snap = await window.dbGet(window.dbRef(window.db, 'users/' + key));
                if (!snap.exists() || snap.val().password !== password) {
                    showToast('সঠিক মোবাইল/ইমেইল ও পাসওয়ার্ড দিন!', true);
                    return;
                }

                localStorage.setItem('expense_user_key', key);
                attachLiveUserListener(key);
                showToast('সফলভাবে প্রবেশ করেছেন');
            } catch(err) {
                showToast('লগইন করতে সমস্যা হয়েছে!', true);
            }
        }

        function handleLogout() {
            localStorage.removeItem('expense_user_key');
            currentUser = null;
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
        }

        function attachLiveUserListener(key) {
            const userRef = window.dbRef(window.db, 'users/' + key);
            window.dbOnValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    currentUser = snapshot.val();
                    if (!currentUser.transactions) currentUser.transactions = [];
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    refreshUI();
                }
            });
        }

        function setTransactionType(type) {
            currentType = type;
            const incBtn = document.getElementById('type-income-btn');
            const expBtn = document.getElementById('type-expense-btn');
            if (type === 'income') {
                incBtn.className = "py-2 text-xs font-bold rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-700";
                expBtn.className = "py-2 text-xs font-bold rounded-lg border border-slate-200 text-slate-500";
            } else {
                expBtn.className = "py-2 text-xs font-bold rounded-lg border border-rose-500 bg-rose-50 text-rose-700";
                incBtn.className = "py-2 text-xs font-bold rounded-lg border border-slate-200 text-slate-500";
            }
        }

        async function handleAddTransaction(e) {
            e.preventDefault();
            const date = document.getElementById('trans-date').value;
            const category = document.getElementById('trans-category').value.trim();
            const amount = parseFloat(document.getElementById('trans-amount').value);
            const note = document.getElementById('trans-note').value.trim();

            const newTx = { id: 'tx_' + Date.now(), type: currentType, date, category, amount, note };
            currentUser.transactions.push(newTx);

            await window.dbSet(window.dbRef(window.db, 'users/' + currentUser.key), currentUser);
            showToast('হিসাব সংরক্ষণ করা হয়েছে');
            document.getElementById('trans-amount').value = '';
            document.getElementById('trans-note').value = '';
        }

        async function deleteTransaction(id) {
            currentUser.transactions = currentUser.transactions.filter(t => t.id !== id);
            await window.dbSet(window.dbRef(window.db, 'users/' + currentUser.key), currentUser);
            showToast('লেনদেন মুছে ফেলা হয়েছে');
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function refreshUI() {
            document.getElementById('user-display-name').innerText = currentUser.name;
            let totalIncome = 0, totalExpense = 0;

            // Sort newest date first
            const sortedList = [...currentUser.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedList.forEach(t => {
                if (t.type === 'income') totalIncome += t.amount;
                else totalExpense += t.amount;
            });

            document.getElementById('dash-total-income').innerText = '৳ ' + totalIncome.toFixed(2);
            document.getElementById('dash-total-expense').innerText = '৳ ' + totalExpense.toFixed(2);
            document.getElementById('dash-net-balance').innerText = '৳ ' + (totalIncome - totalExpense).toFixed(2);

            const tbody = document.getElementById('recent-transactions-tbody');
            tbody.innerHTML = '';

            if (sortedList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-400">কোনো তথ্য পাওয়া যায়নি</td></tr>';
                return;
            }

            sortedList.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-2 px-2">${t.date}</td>
                    <td class="py-2 px-2 font-bold">${t.category}</td>
                    <td class="py-2 px-2 text-slate-400">${t.note || '-'}</td>
                    <td class="py-2 px-2 text-right font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">${t.type === 'income' ? '+' : '-'} ৳${t.amount.toFixed(2)}</td>
                    <td class="py-2 px-2 text-center">
                        <button onclick="deleteTransaction('${t.id}')" class="text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
