<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আয়-ব্যয় ট্র্যাকার | Daily Income & Expense Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Hind Siliguri"', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            #print-modal { position: absolute !important; left: 0; top: 0; width: 100%; box-shadow: none; display: block !important; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg"></div>

    <!-- Top Controls -->
    <div class="fixed top-4 right-4 z-50 flex items-center space-x-2 no-print">
        <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow flex items-center justify-center text-slate-600 dark:text-slate-300">
            <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
            <i class="fa-solid fa-moon inline dark:hidden"></i>
        </button>
    </div>

    <!-- Login / Register Screen -->
    <div id="auth-screen" class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-xl flex items-center justify-center text-xl mx-auto mb-2">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h1 class="text-xl font-bold">আয়-ব্যয় হিসাব</h1>
                <p class="text-xs text-slate-500 mt-1">সহজ এবং নিরাপদ লগইন</p>
            </div>

            <div class="flex bg-slate-100 dark:bg-slate-700 p-1 rounded-xl mb-5">
                <button onclick="switchTab('login')" id="tab-login-btn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-slate-800 text-sky-600 shadow-sm">লগইন</button>
                <button onclick="switchTab('reg')" id="tab-reg-btn" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500">রেজিস্ট্রেশন</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold mb-1">মোবাইল নাম্বার বা ইমেইল</label>
                    <input type="text" id="login-id" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs" placeholder="01700000000">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">পাসওয়ার্ড</label>
                    <div class="relative">
                        <input type="password" id="login-pass" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs pr-10" placeholder="পাসওয়ার্ড দিন">
                        <button type="button" onclick="togglePass('login-pass', 'eye-1')" class="absolute right-3 top-2.5 text-slate-400">
                            <i class="fa-solid fa-eye" id="eye-1"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs shadow">প্রবেশ করুন</button>
            </form>

            <!-- Register Form -->
            <form id="reg-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold mb-1">আপনার নাম</label>
                    <input type="text" id="reg-name" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs" placeholder="নাম">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">মোবাইল নাম্বার বা ইমেইল</label>
                    <input type="text" id="reg-id" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs" placeholder="01700000000">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">পাসওয়ার্ড</label>
                    <div class="relative">
                        <input type="password" id="reg-pass" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs pr-10" placeholder="কমপক্ষে ৪ সংখ্যার পাসওয়ার্ড">
                        <button type="button" onclick="togglePass('reg-pass', 'eye-2')" class="absolute right-3 top-2.5 text-slate-400">
                            <i class="fa-solid fa-eye" id="eye-2"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow">অ্যাকাউন্ট খুলুন</button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard App -->
    <div id="app-screen" class="hidden flex-grow flex flex-col">
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 px-4 py-3 shadow-sm no-print">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full bg-sky-600 text-white flex items-center justify-center font-bold text-xs" id="user-initial">U</div>
                    <span class="font-bold text-xs sm:text-sm" id="user-name-display">ব্যবহারকারী</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openPrintModal()" class="px-3 py-1.5 bg-sky-50 dark:bg-sky-950 text-sky-600 dark:text-sky-400 font-bold rounded-xl text-xs border border-sky-200 dark:border-sky-800 flex items-center space-x-1">
                        <i class="fa-solid fa-print"></i><span>প্রিন্ট</span>
                    </button>
                    <button onclick="logout()" class="px-3 py-1.5 bg-rose-50 dark:bg-rose-950 text-rose-600 dark:text-rose-400 font-bold rounded-xl text-xs border border-rose-200 dark:border-rose-800">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl w-full mx-auto p-4 space-y-4 flex-grow">
            <!-- Summary Cards -->
            <div class="grid grid-cols-3 gap-2 sm:gap-4 text-center">
                <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <span class="text-[10px] text-emerald-600 font-bold block">মোট আয়</span>
                    <h3 class="text-sm sm:text-lg font-bold text-emerald-700 mt-1" id="total-income">৳ ০.০০</h3>
                </div>
                <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <span class="text-[10px] text-rose-600 font-bold block">মোট ব্যয়</span>
                    <h3 class="text-sm sm:text-lg font-bold text-rose-700 mt-1" id="total-expense">৳ ০.০০</h3>
                </div>
                <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <span class="text-[10px] text-sky-600 font-bold block">ব্যালেন্স</span>
                    <h3 class="text-sm sm:text-lg font-bold text-sky-700 mt-1" id="net-balance">৳ ০.০০</h3>
                </div>
            </div>

            <!-- Add Form -->
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm no-print">
                <h2 class="font-bold text-xs mb-3 text-sky-600">নতুন হিসাব যোগ করুন</h2>
                <form onsubmit="addTransaction(event)" class="grid grid-cols-1 sm:grid-cols-5 gap-2">
                    <select id="tx-type" class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-xs font-bold">
                        <option value="income">আয় (+)</option>
                        <option value="expense">ব্যয় (-)</option>
                    </select>
                    <input type="date" id="tx-date" required class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-xs">
                    <input type="text" id="tx-cat" required placeholder="খাত (যেমন: বাজার)" class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-xs">
                    <input type="number" step="0.01" id="tx-amount" required placeholder="টাকা" class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-xs">
                    <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-lg text-xs py-2 shadow">যুক্ত করুন</button>
                </form>
            </div>

            <!-- Transactions List -->
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <h2 class="font-bold text-xs mb-3">লেনদেনের তালিকা</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400">
                                <th class="py-2 px-2">তারিখ</th>
                                <th class="py-2 px-2">খাত</th>
                                <th class="py-2 px-2 text-right">পরিমাণ</th>
                                <th class="py-2 px-2 text-center no-print">মুছুন</th>
                            </tr>
                        </thead>
                        <tbody id="tx-tbody" class="divide-y divide-slate-100 dark:divide-slate-700/50"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Print Modal -->
    <div id="print-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white text-slate-900 w-full max-w-2xl rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 no-print">
                <h3 class="font-bold text-sm">হিসাব রিপোর্ট</h3>
                <button onclick="closePrintModal()" class="text-slate-500 font-bold px-2 py-1 bg-slate-100 rounded">✕</button>
            </div>
            <div class="text-center">
                <h2 class="text-lg font-bold">দৈনন্দিন আয়-ব্যয় হিসাব রিপোর্ট</h2>
                <p class="text-xs text-slate-500" id="print-user-info"></p>
            </div>
            <table class="w-full text-left text-xs border border-slate-300">
                <thead>
                    <tr class="bg-slate-100 font-bold">
                        <th class="border border-slate-300 p-2">তারিখ</th>
                        <th class="border border-slate-300 p-2">ধরন</th>
                        <th class="border border-slate-300 p-2">খাত</th>
                        <th class="border border-slate-300 p-2 text-right">টাকা</th>
                    </tr>
                </thead>
                <tbody id="print-tbody"></tbody>
            </table>
            <div class="flex justify-end space-x-2 no-print pt-2">
                <button onclick="closePrintModal()" class="px-4 py-2 bg-slate-200 text-xs rounded-xl font-bold">বন্ধ করুন</button>
                <button onclick="window.print()" class="px-4 py-2 bg-sky-600 text-white text-xs rounded-xl font-bold">প্রিন্ট করুন</button>
            </div>
        </div>
    </div>

    <script>
        let dbUsers = JSON.parse(localStorage.getItem('simple_users') || '{}');
        let currentUserKey = localStorage.getItem('simple_current_user') || null;

        function showToast(msg, isErr = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed bottom-5 right-5 z-50 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg ${isErr ? 'bg-rose-600' : 'bg-emerald-600'}`;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        }

        function togglePass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = "fa-solid fa-eye-slash";
            } else {
                input.type = 'password';
                icon.className = "fa-solid fa-eye";
            }
        }

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('reg-form').classList.add('hidden');
                document.getElementById('tab-login-btn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-slate-800 text-sky-600 shadow-sm";
                document.getElementById('tab-reg-btn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500";
            } else {
                document.getElementById('reg-form').classList.remove('hidden');
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('tab-reg-btn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-slate-800 text-emerald-600 shadow-sm";
                document.getElementById('tab-login-btn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500";
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const id = document.getElementById('reg-id').value.trim();
            const pass = document.getElementById('reg-pass').value;

            if (dbUsers[id]) {
                showToast('এই নম্বর বা ইমেইল দিয়ে আগেই অ্যাকাউন্ট খোলা হয়েছে!', true);
                return;
            }

            dbUsers[id] = { name, pass, txs: [] };
            localStorage.setItem('simple_users', JSON.stringify(dbUsers));
            showToast('অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!');
            switchTab('login');
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value;

            if (!dbUsers[id] || dbUsers[id].pass !== pass) {
                showToast(' ভুল নম্বর অথবা পাসওয়ার্ড!', true);
                return;
            }

            currentUserKey = id;
            localStorage.setItem('simple_current_user', id);
            showToast('সফলভাবে প্রবেশ করেছেন!');
            initApp();
        }

        function logout() {
            currentUserKey = null;
            localStorage.removeItem('simple_current_user');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        function initApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];

            const user = dbUsers[currentUserKey];
            document.getElementById('user-name-display').innerText = user.name;
            document.getElementById('user-initial').innerText = user.name.charAt(0);
            renderData();
        }

        function addTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const date = document.getElementById('tx-date').value;
            const cat = document.getElementById('tx-cat').value.trim();
            const amount = parseFloat(document.getElementById('tx-amount').value);

            const user = dbUsers[currentUserKey];
            user.txs.unshift({ id: Date.now(), type, date, cat, amount });

            localStorage.setItem('simple_users', JSON.stringify(dbUsers));
            showToast('হিসাব সংরক্ষণ করা হয়েছে!');
            document.getElementById('tx-cat').value = '';
            document.getElementById('tx-amount').value = '';
            renderData();
        }

        function deleteTx(id) {
            const user = dbUsers[currentUserKey];
            user.txs = user.txs.filter(t => t.id !== id);
            localStorage.setItem('simple_users', JSON.stringify(dbUsers));
            showToast('হিসাব মুছে ফেলা হয়েছে!');
            renderData();
        }

        function renderData() {
            const user = dbUsers[currentUserKey];
            let income = 0, expense = 0;
            const tbody = document.getElementById('tx-tbody');
            tbody.innerHTML = '';

            if (!user.txs || user.txs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">কোনো তথ্য নেই</td></tr>`;
            } else {
                user.txs.forEach(t => {
                    if (t.type === 'income') income += t.amount;
                    else expense += t.amount;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 dark:hover:bg-slate-700/30";
                    tr.innerHTML = `
                        <td class="py-2 px-2 text-slate-500">${t.date}</td>
                        <td class="py-2 px-2 font-bold">${t.cat}</td>
                        <td class="py-2 px-2 text-right font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">${t.type === 'income' ? '+' : '-'} ৳${t.amount.toFixed(2)}</td>
                        <td class="py-2 px-2 text-center no-print"><button onclick="deleteTx(${t.id})" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash"></i></button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('total-income').innerText = `৳ ${income.toFixed(2)}`;
            document.getElementById('total-expense').innerText = `৳ ${expense.toFixed(2)}`;
            document.getElementById('net-balance').innerText = `৳ ${(income - expense).toFixed(2)}`;
        }

        function openPrintModal() {
            const user = dbUsers[currentUserKey];
            document.getElementById('print-user-info').innerText = `ব্যবহারকারী: ${user.name}`;
            const pTbody = document.getElementById('print-tbody');
            pTbody.innerHTML = '';

            if (!user.txs || user.txs.length === 0) {
                pTbody.innerHTML = `<tr><td colspan="4" class="p-2 text-center">কোনো তথ্য নেই</td></tr>`;
            } else {
                user.txs.forEach(t => {
                    pTbody.innerHTML += `
                        <tr>
                            <td class="border border-slate-300 p-2">${t.date}</td>
                            <td class="border border-slate-300 p-2 font-bold ${t.type === 'income' ? 'text-emerald-700' : 'text-rose-700'}">${t.type === 'income' ? 'আয়' : 'ব্যয়'}</td>
                            <td class="border border-slate-300 p-2">${t.cat}</td>
                            <td class="border border-slate-300 p-2 text-right font-bold">৳${t.amount.toFixed(2)}</td>
                        </tr>
                    `;
                });
            }
            document.getElementById('print-modal').classList.remove('hidden');
        }

        function closePrintModal() {
            document.getElementById('print-modal').classList.add('hidden');
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        window.onload = function() {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
            if (currentUserKey && dbUsers[currentUserKey]) {
                initApp();
            }
        }
    </script>
</body>
</html>
